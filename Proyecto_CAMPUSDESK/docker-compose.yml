# ==============================================================================
# CAMPUSDESK - Orquestación Multi-Contenedor (TechNova Solutions)
# Arquitectura: PostgreSQL 16 + Redis 7 + Spring Boot 4 (Java 21) + Frontend Nginx
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. SERVICIO DE BASE DE DATOS: PostgreSQL 16
  # ----------------------------------------------------------------------------
  campusdesk-db:
    container_name: campusdesk-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_gestion_usuarios}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CampusDesk_Pass_2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Puerto host alternativo configurable en localhost (aislado de la red externa)
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-sistema_gestion_usuarios}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campusdesk-network

  # ----------------------------------------------------------------------------
  # 2. SERVICIO DE CACHÉ Y SESIONES DISTRIBUIDAS: Redis 7 Alpine
  # ----------------------------------------------------------------------------
  campusdesk-redis:
    image: redis:7-alpine
    container_name: campusdesk-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-CampusDesk_Redis_Pass_2026!}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      # Puerto host alternativo configurable en localhost (aislado de la red externa)
      - "127.0.0.1:${REDIS_HOST_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    networks:
      - campusdesk-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CampusDesk_Redis_Pass_2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. SERVICIO BACKEND: REST API Spring Boot (Java 21 / JRE Alpine)
  # ----------------------------------------------------------------------------
  campusdesk-backend:
    container_name: campusdesk-backend
    build:
      context: ./spring-security-user-role-management
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      campusdesk-db:
        condition: service_healthy
      campusdesk-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${BACKEND_INTERNAL_PORT:-8056}
      DB_URL: jdbc:postgresql://campusdesk-db:5432/${POSTGRES_DB:-sistema_gestion_usuarios}
      DB_USERNAME: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-CampusDesk_Pass_2026!}
      JWT_SECRET: ${JWT_SECRET:-CampusDesk_Secret_Key_2026_Secure_Token_Min32Chars!}
      JWT_ISSUER: ${JWT_ISSUER:-CampusDesk_API}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Conexión Redis distribuida
      REDIS_HOST: campusdesk-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CampusDesk_Redis_Pass_2026!}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5506,http://localhost:5500}
    ports:
      # Puerto host alternativo en localhost para pruebas directas del anfitrión (aislado de la red externa)
      - "127.0.0.1:${BACKEND_PORT:-8056}:${BACKEND_INTERNAL_PORT:-8056}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8056/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - campusdesk-network

  # ----------------------------------------------------------------------------
  # 4. SERVICIO FRONTEND: Servidor Web Ligero Nginx Alpine
  # ----------------------------------------------------------------------------
  campusdesk-frontend:
    container_name: campusdesk-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      campusdesk-backend:
        condition: service_healthy
    ports:
      # Único puerto expuesto a la red local para acceso de computadores clientes
      - "${FRONTEND_PORT:-5506}:80"
    networks:
      - campusdesk-network

# ==============================================================================
# RED COMPARTIDA: Aislamiento y resolución DNS interna
# ==============================================================================
networks:
  campusdesk-network:
    name: campusdesk-network
    driver: bridge

# ==============================================================================
# VOLÚMENES PERSISTENTES: Preservación de datos de PostgreSQL y Redis
# ==============================================================================
volumes:
  pgdata:
    name: campusdesk-pgdata
    driver: local
  redis_data:
    name: campusdesk-redis_data
    driver: local
