# Desarrollo - PostgreSQL (valores por defecto alineados con docker-compose/.env: DB 5436, Redis 6385)
server.port=${PORT:${SERVER_PORT:8056}}
server.forward-headers-strategy=framework

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/sistema_gestion_usuarios}}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:CampusDesk_Pass_2026!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Configuración JWT (HMAC256). En DEV hay un secreto por defecto (>=32 chars) para poder ejecutar con bootRun/IDE sin .env.
# En PROD JWT_SECRET es obligatorio (ver application-prod.properties).
security.jwt.secret=${JWT_SECRET:CampusDesk_Dev_Only_Secret_Key_2026_Min32Chars!}
security.jwt.issuer=${JWT_ISSUER:CampusDesk_API}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuración CORS (E5 - Orígenes explícitos configurables por entorno)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5506,http://localhost:5500}

# Configuración Spring Data Redis (Gestión distribuida de sesiones y caché caliente)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6385}
spring.data.redis.password=${REDIS_PASSWORD:CampusDesk_Redis_Pass_2026!}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Tiempo de vida de la sesión en Redis (8 horas = 28800 segundos por defecto)
security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}
