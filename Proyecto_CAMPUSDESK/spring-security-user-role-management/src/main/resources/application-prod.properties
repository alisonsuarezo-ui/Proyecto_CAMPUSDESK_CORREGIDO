# ==============================================================================
# CAMPUSDESK - Perfil de Producción (application-prod.properties)
# TechNova Solutions · Entornos de Producción y Alta Disponibilidad
# ==============================================================================

server.port=${PORT:${SERVER_PORT:8056}}
server.forward-headers-strategy=framework

# Orígenes CORS permitidos en producción
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5506}

# Conexión PostgreSQL en Producción
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración Hibernate / JPA para Producción
# Validación estricta del esquema sin modificación automática
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Seguridad JWT (HMAC256)
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:CampusDesk_API}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Redis distribuido para gestión de sesiones
spring.data.redis.host=${REDIS_HOST:campusdesk-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=1000ms

security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}

# Ocultar stack traces y mensajes detallados de error del servidor en producción
server.error.include-stacktrace=never
server.error.include-message=never
