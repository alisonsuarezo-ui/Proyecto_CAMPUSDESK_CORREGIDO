spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:userroles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${TEST_DB_DDL:create-drop}
spring.jpa.show-sql=false
server.port=0

spring.jpa.properties.hibernate.auto_quote_keyword=true

app.bootstrap.enabled=true
app.bootstrap.username=superadmin
app.bootstrap.email=superadmin@test.local
app.bootstrap.password=secret

# Configuración independiente para pruebas.
security.jwt.secret=test-signing-secret-not-for-production
security.jwt.issuer=user-management-tests
security.jwt.expiration=30m
