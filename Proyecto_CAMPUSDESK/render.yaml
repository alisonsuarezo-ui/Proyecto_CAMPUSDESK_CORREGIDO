# ==============================================================================
# CAMPUSDESK - Render Infrastructure Blueprint (render.yaml)
# TechNova Solutions - Despliegue Automatizado en Render
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API Spring Boot (Java 21 / Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusdesk-backend
    runtime: docker
    dockerfilePath: ./spring-security-user-role-management/Dockerfile
    dockerContext: ./spring-security-user-role-management
    plan: free
    region: oregon
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: JWT_ISSUER
        value: CampusDesk_API
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Secretos a configurar en el dashboard de Render:
      - key: JWT_SECRET
        generateValue: true
      # Conexión a Base de Datos PostgreSQL (Neon / Supabase / Render Postgres):
      # Formato: jdbc:postgresql://ep-xxxx.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Conexión a Redis (Upstash Serverless Redis - Gratuito):
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: SESSION_TTL_SECONDS
        value: "28800"

  # ----------------------------------------------------------------------------
  # 2. Frontend Web App (HTML5 / CSS3 / Vanilla JS)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusdesk-frontend
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: ./Frontend
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /registro
        destination: /registro.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /*
        destination: /index.html
