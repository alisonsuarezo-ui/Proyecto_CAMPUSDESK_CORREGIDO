<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión · CAMPUSDESK</title>
  <link rel="stylesheet" href="auth.css">
  <script src="config.js?v=20261020"></script>
</head>
<body>

  <!-- Contenedor principal de autenticación -->
  <main class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo y título estilo NEXO -->
      <header class="auth-header">
        <div class="auth-logo-box">
          <svg width="42" height="42" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Logo CAMPUSDESK">
            <!-- Rombo exterior -->
            <polygon points="24,4 44,24 24,44 4,24" stroke="#10B981" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
            <!-- Rombo interior -->
            <polygon points="24,13 35,24 24,35 13,24" stroke="#34D399" stroke-width="2.5" fill="rgba(16, 185, 129, 0.22)" stroke-linejoin="round"/>
            <!-- Conectores geométricos -->
            <line x1="24" y1="4" x2="24" y2="13" stroke="#10B981" stroke-width="2"/>
            <line x1="24" y1="35" x2="24" y2="44" stroke="#10B981" stroke-width="2"/>
            <line x1="4" y1="24" x2="13" y2="24" stroke="#10B981" stroke-width="2"/>
            <line x1="35" y1="24" x2="44" y2="24" stroke="#10B981" stroke-width="2"/>
          </svg>
        </div>
        <h1 class="auth-title">CAMPUSDESK</h1>
        <p class="auth-subtitle">Gestión y Seguridad</p>
      </header>

      <!-- Caja de alertas (error o éxito) -->
      <div id="alertBox" class="alert" role="alert"></div>

      <!-- Formulario de inicio de sesión -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="ejemplo@campusdesk.com"
            autocomplete="email"
            required
            autofocus
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span>Iniciar Sesión</span>
        </button>
      </form>

      <!-- Enlace para registrarse -->
      <p class="auth-switch">
        ¿No tienes cuenta? <a href="registro.html" class="auth-link">Regístrate aquí</a>
      </p>

    </div>
  </main>

  <!-- Pie de página con estado de conexión -->
  <footer class="auth-footer">
    <div style="width: 140px;"></div>
    <div class="auth-footer-center">Mesa de Ayuda - CAMPUSDESK</div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Conexión activa</span>
    </div>
  </footer>

  <script>
    'use strict';

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    const BASE_URL = (typeof window.getCampusDeskApiUrl === 'function')
      ? window.getCampusDeskApiUrl()
      : (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:8056');

    const API_URL = `${BASE_URL}/auth/login`;

    // Verificación de sesión previa validando contrato con el backend (sin confiar a ciegas en el token)
    (async function verifyExistingSession() {
      const token = sessionStorage.getItem('token');
      if (!token) return;

      try {
        const resp = await fetch(`${BASE_URL}/auth/me`, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (resp.ok) {
          window.location.replace('dashboard.html');
        } else {
          // Si el token es inválido o expiró en Redis, purgar almacenamiento local
          sessionStorage.removeItem('token');
          sessionStorage.removeItem('jwt_token');
          sessionStorage.removeItem('role');
          sessionStorage.removeItem('user_role');
          sessionStorage.removeItem('userEmail');
          sessionStorage.removeItem('user_email');
        }
      } catch (e) {
        // Si el backend no está disponible, no redirigir a ciegas
      }
    })();

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
    }

    function clearAlert() {
      alertBox.textContent = '';
      alertBox.className = 'alert';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validación básica en el cliente
      if (!email || !password) {
        showAlert('Por favor completa todos los campos.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verificando...</span>';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {
          console.warn('[CAMPUSDESK Auth Diagnosis]', {
            status: response.status,
            statusText: response.statusText,
            url: API_URL,
            backendResponse: data
          });

          if (response.status === 401) {
            showAlert('Credenciales inválidas. Verifica tu correo y contraseña.', 'error');
          } else if (response.status === 403) {
            showAlert('Acceso denegado (403). Restricción de seguridad u origen no autorizado (CORS).', 'error');
          } else if (response.status === 404) {
            showAlert('Ruta de autenticación no encontrada (404). Verifica que Nginx esté enrutando /auth al backend.', 'error');
          } else if (response.status >= 500) {
            showAlert('Error interno del servidor (5xx). Verifica que PostgreSQL y Redis estén activos en Docker.', 'error');
          } else {
            const errorMessage = (data && (data.message || data.error)) || `Error inesperado de autenticación (HTTP ${response.status}).`;
            showAlert(errorMessage, 'error');
          }
          return;
        }

        // Si es exitoso, almacenar token JWT y rol en sessionStorage
        if (data && data.token) {
          const role = data.role || data.rol || 'USER';
          sessionStorage.setItem('token', data.token);
          sessionStorage.setItem('jwt_token', data.token);
          sessionStorage.setItem('role', role);
          sessionStorage.setItem('user_role', role);
          sessionStorage.setItem('userEmail', email);
          sessionStorage.setItem('user_email', email);

          showAlert('Autenticación exitosa. Redirigiendo...', 'success');

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        } else {
          showAlert('Error inesperado al procesar la respuesta del servidor.', 'error');
        }

      } catch (error) {
        console.error('[CAMPUSDESK Auth Network Error]', { url: API_URL, error: error.message });
        showAlert(`Error de conexión con el servidor (${BASE_URL}). Verifica que los contenedores estén activos y que la red local permita la comunicación.`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Iniciar Sesión</span>';
      }
    });
  </script>
</body>
</html>
